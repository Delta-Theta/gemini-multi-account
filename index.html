<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEC-3 FIX: Strict Content-Security-Policy blocking inline scripts and remote code -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self';">
    <title>Gemini Seamless Multi-Account</title>
    <link rel="stylesheet" href="style.css">
    <!-- SEC-G2 FIX: Local SweetAlert2 instead of CDN -->
    <script src="./node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Main Content Area (Full-Width Native Gemini Layout) -->
        <main id="main-content">
            <!-- Topbar (Native-looking Account Switcher & Context Sync Bar) -->
            <header id="topbar">
                <div class="model-info">
                    <span class="gemini-logo">✨ Gemini Multi-Account</span>
                </div>

                <div class="controls">
                    <!-- Sync Delta Button in Topbar -->
                    <button id="paste-delta-container" class="sync-delta-btn hidden" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                        <span id="paste-delta-text">Sync Context</span>
                    </button>

                    <select id="account-select" class="dropdown-btn" aria-label="Select Gemini Account">
                        <option value="0">Account 1</option>
                        <option value="1">Account 2</option>
                    </select>

                    <button id="add-account-btn" class="btn add-btn" type="button" title="Add another account (up to 5)">+</button>
                </div>
            </header>

            <!-- The BrowserView covers the full viewport below the 60px topbar via main.js -->
        </main>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
